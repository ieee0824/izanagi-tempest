[workspace]
members = ["crates/tempest-model", "crates/tempest", "crates/tempest-guest"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
yaml_serde = "=0.10.7"
sha2 = "0.10"
tempest-model = { path = "crates/tempest-model" }
