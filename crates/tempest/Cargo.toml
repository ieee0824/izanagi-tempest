[package]
name = "tempest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
# Builds a formally ineligible runtime that can replace only the production
# model relay authority with an owner-selected loopback fixture.
native-test-upstream = []

[dependencies]
tempest-model.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
yaml_serde.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["full"] }
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
